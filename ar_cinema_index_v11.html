<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>視聽室 AR 電影預告牆</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>
  // Removes the plain-white background of the promo video in real time, so
  // only the DVD case artwork + printed captions stay visible and the live
  // camera feed shows through everywhere else.
  AFRAME.registerComponent('chromakey-video', {
    schema: {
      video: { type: 'selector' },
      width: { default: 1 },
      height: { default: 1.413 },
      threshold: { default: 0.90 },
      feather: { default: 0.05 }
    },
    init: function () {
      const THREE = AFRAME.THREE;
      const texture = new THREE.VideoTexture(this.data.video);
      texture.colorSpace = THREE.SRGBColorSpace;
      const material = new THREE.ShaderMaterial({
        uniforms: {
          map: { value: texture },
          threshold: { value: this.data.threshold },
          feather: { value: this.data.feather }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D map;
          uniform float threshold;
          uniform float feather;
          varying vec2 vUv;
          void main() {
            vec4 texColor = texture2D(map, vUv);
            float minC = min(min(texColor.r, texColor.g), texColor.b);
            float alpha = 1.0 - smoothstep(threshold - feather, threshold, minC);
            if (alpha < 0.02) discard;
            gl_FragColor = vec4(texColor.rgb, alpha);
          }
        `,
        transparent: true,
        side: THREE.DoubleSide
      });
      const geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
      this.mesh = new THREE.Mesh(geometry, material);
      this.el.setObject3D('mesh', this.mesh);
    },
    remove: function () {
      this.el.removeObject3D('mesh');
    }
  });
</script>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  a-scene { position:absolute; top:0; left:0; width:100%; height:100%; }

  #hint {
    position:fixed; left:50%; top:14px; transform:translateX(-50%);
    padding:9px 16px; background:rgba(17,24,39,.65); color:#fff; font-size:13px;
    border-radius:999px; pointer-events:none; z-index:5; text-align:center; max-width:86vw;
  }
  #foundLabel {
    position:fixed; top:60px; left:50%; transform:translateX(-50%);
    background:rgba(255,212,71,.95); color:#0b1220; font-weight:700; font-size:13px;
    padding:6px 16px; border-radius:999px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:5;
  }
  #foundLabel.show { opacity:1; }

  /* ---- Calibration control panel ---- */
  #panel {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    z-index:6; background:rgba(17,24,39,.72); border-radius:16px; padding:10px 12px;
    display:flex; flex-direction:column; gap:8px; align-items:center;
    -webkit-user-select:none; user-select:none;
  }
  #panel .row { display:flex; gap:8px; align-items:center; }
  #panel .label { color:#9ca3af; font-size:11px; width:34px; text-align:right; }
  #panel button {
    width:42px; height:38px; border-radius:10px; border:none;
    background:#2a3548; color:#fff; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  #panel button:active { background:#ffd447; color:#0b1220; }
  #panel #resetBtn { width:auto; padding:0 14px; font-size:12px; background:#4b5563; }
  #toggleBtn {
    position:fixed; right:12px; bottom:14px; z-index:7; width:38px; height:38px;
    border-radius:50%; border:none; background:rgba(17,24,39,.72); color:#fff; font-size:16px;
  }
</style>
</head>
<body>

  <div id="hint">請將鏡頭對準視聽室舞台場景</div>
  <div id="foundLabel">偵測到場景！</div>

  <button id="toggleBtn">⚙️</button>
  <div id="panel">
    <div class="row">
      <span class="label">大小</span>
      <button data-act="scale-" >－</button>
      <button data-act="scale+">＋</button>
    </div>
    <div class="row">
      <span class="label">上下</span>
      <button data-act="up">▲</button>
      <button data-act="down">▼</button>
    </div>
    <div class="row">
      <span class="label">左右</span>
      <button data-act="left">◀</button>
      <button data-act="right">▶</button>
    </div>
    <div class="row">
      <span class="label">遠近</span>
      <button data-act="far">－</button>
      <button data-act="near">＋</button>
    </div>
    <button id="resetBtn">重設位置</button>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./movietargets_v11.mind; uiScanning: no; uiLoading: no;"
           color-space="sRGB"
           renderer="colorManagement: true, physicallyCorrectLights: true"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="carousel" src="./carousel_ar_v11.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex 0 = 視聽室舞台場景 -->
    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity id="adjustable" position="0 0 0.02" scale="1 1 1" rotation="0 0 0">
        <a-entity chromakey-video="video: #carousel; width: 1; height: 1.413"></a-entity>
      </a-entity>
    </a-entity>

  </a-scene>

<script>
  const carousel = document.getElementById('carousel');
  const foundLabel = document.getElementById('foundLabel');

  function primeOnce() {
    carousel.play().then(() => carousel.pause()).catch(() => {});
    document.removeEventListener('touchend', primeOnce);
    document.removeEventListener('click', primeOnce);
  }
  document.addEventListener('touchend', primeOnce, { once: true });
  document.addEventListener('click', primeOnce, { once: true });

  const el = document.getElementById('target0');
  el.addEventListener('targetFound', () => {
    if (carousel.paused) { carousel.currentTime = 0; carousel.play().catch(() => {}); }
    foundLabel.classList.add('show');
  });
  el.addEventListener('targetLost', () => {
    foundLabel.classList.remove('show');
  });

  // ---------- Calibration controls ----------
  const STORE_KEY = 'ar-cinema-transform-v10';
  const DEFAULT_T = { x: 0, y: 0, z: 0.02, s: 1 };
  let t = Object.assign({}, DEFAULT_T);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved) t = Object.assign({}, DEFAULT_T, saved);
  } catch (e) {}

  const adjustable = document.getElementById('adjustable');
  const POS_STEP = 0.04;
  const SCALE_STEP = 0.05;

  function applyTransform() {
    adjustable.setAttribute('position', `${t.x} ${t.y} ${t.z}`);
    adjustable.setAttribute('scale', `${t.s} ${t.s} ${t.s}`);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(t)); } catch (e) {}
  }
  applyTransform();

  const actions = {
    'scale+': () => { t.s = Math.min(4, t.s + SCALE_STEP); },
    'scale-': () => { t.s = Math.max(0.1, t.s - SCALE_STEP); },
    'up':     () => { t.y += POS_STEP; },
    'down':   () => { t.y -= POS_STEP; },
    'left':   () => { t.x -= POS_STEP; },
    'right':  () => { t.x += POS_STEP; },
    'near':   () => { t.z += POS_STEP; },
    'far':    () => { t.z -= POS_STEP; }
  };

  document.querySelectorAll('#panel button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      actions[btn.dataset.act]();
      applyTransform();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    t = Object.assign({}, DEFAULT_T);
    applyTransform();
  });

  document.getElementById('toggleBtn').addEventListener('click', () => {
    const panel = document.getElementById('panel');
    panel.style.display = (panel.style.display === 'none') ? 'flex' : 'none';
  });
</script>
</body>
</html>
