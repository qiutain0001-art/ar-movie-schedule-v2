<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>圖書館電影播映節目表 - WebAR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }

  #startScreen {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(160deg,#0b0b0f,#1a1a22);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; gap: 18px;
  }
  #startScreen h1 { font-size: 22px; margin: 0; letter-spacing: 1px; }
  #startScreen p { font-size: 14px; opacity: .75; margin: 0; max-width: 320px; line-height: 1.6; }
  #startBtn {
    margin-top: 8px; padding: 14px 36px; font-size: 16px; font-weight: 600;
    border-radius: 999px; border: none; color: #111;
    background: #ffd53d;
  }
  #startBtn:active { transform: scale(0.97); }

  #scanHint {
    position: fixed; top: 18px; left: 0; right: 0; z-index: 40;
    text-align: center; color: #fff; font-size: 14px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    pointer-events: none; display: none;
  }
  #scanHint .badge {
    display: inline-block; background: rgba(0,0,0,.55);
    padding: 8px 16px; border-radius: 999px;
  }

  #panelToggle {
    position: fixed; top: 14px; right: 14px; z-index: 60;
    width: 40px; height: 40px; border-radius: 999px; border: none;
    background: rgba(0,0,0,.55); color: #fff; font-size: 18px;
    display: none; align-items: center; justify-content: center;
  }

  #adjustPanel {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 55;
    background: rgba(20,20,24,.88); color: #fff; border-radius: 14px;
    padding: 14px 16px 10px; font-size: 13px; display: none;
  }
  #adjustPanel h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .adjRow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .adjRow label { width: 64px; flex-shrink: 0; opacity: .85; }
  .adjRow input[type="range"] { flex: 1; }
  .adjRow span { width: 46px; text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
  #resetBtn {
    width: 100%; padding: 8px; margin-top: 4px; border: none; border-radius: 8px;
    background: #444; color: #fff; font-size: 13px;
  }
</style>
</head>
<body>

<div id="startScreen">
  <h1>📽️ 電影播映節目表 AR</h1>
  <p>請將鏡頭對準視聽區的宣傳海報，即可看到本月播映片單動態浮現。<br/>需要相機權限才能開始。</p>
  <button id="startBtn">開始掃描</button>
</div>

<div id="scanHint"><span class="badge">🔍 請對準海報 / 目標圖像</span></div>

<button id="panelToggle">⚙️</button>
<div id="adjustPanel">
  <h3>位置 / 大小校正</h3>
  <div class="adjRow">
    <label>左右 X</label>
    <input type="range" id="adjX" min="-2" max="2" step="0.01" value="0" />
    <span id="valX">0.00</span>
  </div>
  <div class="adjRow">
    <label>上下 Y</label>
    <input type="range" id="adjY" min="-1" max="3" step="0.01" value="0.65" />
    <span id="valY">0.65</span>
  </div>
  <div class="adjRow">
    <label>深淺 Z</label>
    <input type="range" id="adjZ" min="-2" max="2" step="0.01" value="0" />
    <span id="valZ">0.00</span>
  </div>
  <div class="adjRow">
    <label>大小</label>
    <input type="range" id="adjScale" min="0.2" max="3" step="0.01" value="1" />
    <span id="valScale">1.00</span>
  </div>
  <button id="resetBtn">重設為預設值</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./audio_target.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 10;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>
  <a-assets>
    <video id="promoVideo" src="./cinema-rolling-carousel.mp4" loop="true" playsinline webkit-playsinline="true" crossorigin="anonymous" muted="true"></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false" raycaster="far: 10000; objects: .clickable"></a-camera>

  <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
    <a-plane
      id="promoPlane"
      material="shader: chromakey; src: #promoVideo; keyColor: #00ff00; similarity: 0.28; smoothness: 0.10; spill: 0.6; transparent: true; side: double"
      position="0 0.65 0"
      height="1.4"
      width="0.7875"
    ></a-plane>
  </a-entity>
</a-scene>

<script>
  /* ---------------------------------------------------------
     綠幕去背 Shader（Chroma Key），註冊成 A-Frame 材質
     A-Frame 會自動處理 video → texture，並每個 frame 更新畫面
  --------------------------------------------------------- */
  AFRAME.registerShader('chromakey', {
    schema: {
      map: { type: 'map', is: 'uniform' },
      keyColor: { type: 'color', default: '#00ff00', is: 'uniform' },
      similarity: { type: 'number', default: 0.28, is: 'uniform' },
      smoothness: { type: 'number', default: 0.10, is: 'uniform' },
      spill: { type: 'number', default: 0.6, is: 'uniform' },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      precision highp float;
      uniform sampler2D map;
      uniform vec3 keyColor;
      uniform float similarity;
      uniform float smoothness;
      uniform float spill;
      varying vec2 vUv;
      vec2 RGBtoUV(vec3 rgb) {
        return vec2(
          rgb.r * -0.169 - rgb.g * 0.331 + rgb.b * 0.5   + 0.5,
          rgb.r *  0.5   - rgb.g * 0.419 - rgb.b * 0.081 + 0.5
        );
      }
      void main() {
        vec4 tex = texture2D(map, vUv);
        vec2 chromaUV = RGBtoUV(tex.rgb);
        vec2 keyUV    = RGBtoUV(keyColor);
        float d = distance(chromaUV, keyUV);
        float alpha = smoothstep(similarity, similarity + smoothness, d);
        float maxrb = max(tex.r, tex.b);
        vec3 color = tex.rgb;
        color.g = min(color.g, mix(color.g, maxrb, spill));
        gl_FragColor = vec4(color, alpha);
      }
    `,
  });

  const startScreen = document.getElementById("startScreen");
  const startBtn = document.getElementById("startBtn");
  const scanHint = document.getElementById("scanHint");
  const panelToggle = document.getElementById("panelToggle");
  const adjustPanel = document.getElementById("adjustPanel");
  const adjX = document.getElementById("adjX");
  const adjY = document.getElementById("adjY");
  const adjZ = document.getElementById("adjZ");
  const adjScale = document.getElementById("adjScale");
  const valX = document.getElementById("valX");
  const valY = document.getElementById("valY");
  const valZ = document.getElementById("valZ");
  const valScale = document.getElementById("valScale");
  const resetBtn = document.getElementById("resetBtn");

  const sceneEl = document.querySelector("a-scene");
  const promoPlane = document.getElementById("promoPlane");
  const promoVideo = document.getElementById("promoVideo");
  const targetEntity = document.getElementById("targetEntity");

  const DEFAULTS = { x: 0, y: 0.65, z: 0, scale: 1 };

  panelToggle.addEventListener("click", () => {
    adjustPanel.style.display = adjustPanel.style.display === "block" ? "none" : "block";
  });

  function applyTransform() {
    const x = parseFloat(adjX.value);
    const y = parseFloat(adjY.value);
    const z = parseFloat(adjZ.value);
    const s = parseFloat(adjScale.value);
    promoPlane.setAttribute("position", `${x} ${y} ${z}`);
    promoPlane.object3D.scale.set(s, s, s);
    valX.textContent = x.toFixed(2);
    valY.textContent = y.toFixed(2);
    valZ.textContent = z.toFixed(2);
    valScale.textContent = s.toFixed(2);
  }
  [adjX, adjY, adjZ, adjScale].forEach((el) => el.addEventListener("input", applyTransform));
  resetBtn.addEventListener("click", () => {
    adjX.value = DEFAULTS.x; adjY.value = DEFAULTS.y; adjZ.value = DEFAULTS.z; adjScale.value = DEFAULTS.scale;
    applyTransform();
  });

  targetEntity.addEventListener("targetFound", () => {
    scanHint.style.display = "none";
    promoVideo.currentTime = 0;
    promoVideo.play().catch(() => {});
  });
  targetEntity.addEventListener("targetLost", () => {
    scanHint.style.display = "block";
    promoVideo.pause();
  });

  sceneEl.addEventListener("arReady", () => {
    scanHint.style.display = "block";
    panelToggle.style.display = "flex";
  });
  sceneEl.addEventListener("arError", (e) => {
    alert("啟動相機失敗，請確認已允許相機權限。");
    startScreen.style.display = "flex";
  });

  startBtn.addEventListener("click", () => {
    startScreen.style.display = "none";
    sceneEl.systems["mindar-image-system"].start();
  });
</script>

</body>
</html>
